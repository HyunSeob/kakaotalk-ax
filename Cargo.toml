[package]
name = "kakaotalk-ax"
version = "1.0.5"
edition = "2021"
description = "Single native binary for KakaoTalk reading, navigation, and sending on macOS (AX) and Windows (Win32/WinRT) via CLI and MCP"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hyunseob/kakaotalk-ax"
keywords = ["kakaotalk", "accessibility", "mcp", "cli", "automation"]
categories = ["command-line-utilities", "os"]
exclude = [
    ".github/",
    "docs/",
    "skills/",
    "install.sh",
    "install.ps1",
]

[[bin]]
name = "kax"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
caseless = "0.2.2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
