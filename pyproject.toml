[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaotalk-reader"
version = "0.1.0"
description = "CLI tool to read KakaoTalk Mac's encrypted local database"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
web = ["starlette>=0.37", "uvicorn>=0.29"]

[project.scripts]
kakaotalk-reader = "kakaotalk_reader:main"
kakaotalk-mcp = "kakaotalk_mcp:main"

[tool.setuptools]
py-modules = ["kakaotalk_reader", "kakaotalk_service", "kakaotalk_poll", "kakaotalk_mcp"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kakaotalk_web*", "kakaotalk_outbound*"]

[tool.setuptools.package-data]
kakaotalk_web = ["static/*.html", "static/*.js", "static/*.css"]
