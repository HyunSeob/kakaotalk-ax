[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaotalk-ax"
version = "0.9.0"
description = "KakaoTalk native macOS and Windows reading, navigation and sending via CLI and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Operating System :: MacOS", "Operating System :: Microsoft :: Windows"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2; sys_platform != 'win32'"]
dev = ["PyYAML>=6,<7"]

[project.scripts]
kax = "kakaotalk_automation:main"

[tool.setuptools]
py-modules = [
    "kakaotalk_mcp", "kakaotalk_mcp_stdio", "kakaotalk_automation", "kakaotalk_ax", "kakaotalk_state",
    "kakaotalk_win32", "kakaotalk_win32_api", "kakaotalk_win32_clipboard",
    "kakaotalk_win32_image", "kakaotalk_win32_ocr", "kakaotalk_win32_rows",
    "kakaotalk_win32_attachment",
]
packages = ["kakaotalk_native"]

[tool.setuptools.package-data]
kakaotalk_native = ["*.swift"]

[tool.setuptools.package-dir]
"" = "src"
