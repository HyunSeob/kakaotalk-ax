name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "install.sh"
      - "install.ps1"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_sha: ${{ steps.ver.outputs.release_sha }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Determine release version and pin SHA
        id: ver
        run: |
          if git log -1 --pretty=%B | grep -q '^chore(release):'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          VERSION="$CURRENT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${VERSION}\"/" Cargo.toml
            cargo update -p kakaotalk-ax
            cargo metadata --locked --format-version 1 >/dev/null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): v${VERSION}"
            git push origin HEAD:main
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test and build macOS Universal binary
        run: |
          cargo test --locked
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/kax \
            target/x86_64-apple-darwin/release/kax \
            -output dist/kax
          chmod +x dist/kax
          archs="$(lipo -archs dist/kax)"
          echo "$archs" | grep -q "arm64"
          echo "$archs" | grep -q "x86_64"
          tar -C dist -czf kax-macos-universal.tar.gz kax
      - uses: actions/upload-artifact@v4
        with:
          name: kax-macos-universal
          path: kax-macos-universal.tar.gz

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test and build Windows x64 binary
        shell: pwsh
        run: |
          cargo test --locked
          cargo build --release --locked --target x86_64-pc-windows-msvc
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/kax.exe -DestinationPath kax-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: kax-windows-x86_64
          path: kax-windows-x86_64.zip

  publish:
    needs: [prepare, build-macos, build-windows]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets and SHA-256 checksums
        run: |
          mkdir -p release
          cp artifacts/kax-macos-universal/kax-macos-universal.tar.gz release/
          cp artifacts/kax-windows-x86_64/kax-windows-x86_64.zip release/
          (cd release && sha256sum kax-macos-universal.tar.gz kax-windows-x86_64.zip > checksums.txt)
          cat release/checksums.txt
      - name: Create or update GitHub Release at pinned SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating release assets with --clobber."
            gh release upload "$TAG" \
              release/kax-macos-universal.tar.gz \
              release/kax-windows-x86_64.zip \
              release/checksums.txt \
              --clobber
          else
            gh release create "$TAG" \
              release/kax-macos-universal.tar.gz \
              release/kax-windows-x86_64.zip \
              release/checksums.txt \
              --target "$RELEASE_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: kakaotalk-ax-release' "https://crates.io/api/v1/crates/kakaotalk-ax/${VERSION}")"
          if [ "$STATUS" = "200" ]; then
            echo "kakaotalk-ax ${VERSION} is already published on crates.io; skipping duplicate publish."
            exit 0
          fi
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured; cannot publish kakaotalk-ax ${VERSION} to crates.io."
            exit 1
          fi
          cargo publish --locked
