name: Release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "install.sh"
      - "install.ps1"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_sha: ${{ steps.ver.outputs.release_sha }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Determine release version and pin SHA
        id: ver
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] && git log -1 --pretty=%B | grep -q '^chore(release):'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          VERSION="$CURRENT"
          tag_sha="$(git rev-parse --verify -q "refs/tags/v${VERSION}^{commit}" || true)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$(git rev-parse HEAD)" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            # A rerun starts at the trigger commit, even after prepare pushed a bump.
            git fetch --no-tags origin refs/heads/main
            bump="$(git rev-list --first-parent --reverse HEAD..FETCH_HEAD | sed -n '1p')"
            if [[ -n "$bump" && "$(git rev-parse "$bump^1")" == "$(git rev-parse HEAD)" && "$(git log -1 --format=%s "$bump")" == "chore(release): v${VERSION}" ]]; then
              git checkout --detach "$bump"
            else
              sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${VERSION}\"/" Cargo.toml
              cargo update -p kakaotalk-ax
              cargo metadata --locked --format-version 1 >/dev/null
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.toml Cargo.lock
              git commit -m "chore(release): v${VERSION}"
              git push origin HEAD:main
            fi
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          existing="$(git rev-parse --verify -q "refs/tags/v${VERSION}^{commit}" || true)"
          [[ -z "$existing" || "$existing" == "$RELEASE_SHA" ]]
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test and build macOS Universal binary
        run: |
          cargo test --locked
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/kax \
            target/x86_64-apple-darwin/release/kax \
            -output dist/kax
          chmod +x dist/kax
          archs="$(lipo -archs dist/kax)"
          echo "$archs" | grep -q "arm64"
          echo "$archs" | grep -q "x86_64"
          tar -C dist -czf kax-macos-universal.tar.gz kax
      - uses: actions/upload-artifact@v4
        with:
          name: kax-macos-universal
          path: kax-macos-universal.tar.gz

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test on Windows
        run: cargo test --locked
      - name: Build Windows x64 binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows x64 binary
        shell: pwsh
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/kax.exe -DestinationPath kax-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: kax-windows-x86_64
          path: kax-windows-x86_64.zip

  publish:
    needs: [prepare, build-macos, build-windows]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets and SHA-256 checksums
        run: |
          mkdir -p release
          cp artifacts/kax-macos-universal/kax-macos-universal.tar.gz release/
          cp artifacts/kax-windows-x86_64/kax-windows-x86_64.zip release/
          (cd release && sha256sum kax-macos-universal.tar.gz kax-windows-x86_64.zip > checksums.txt)
          cat release/checksums.txt
      - name: Create GitHub Release at pinned SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          assets=(release/kax-macos-universal.tar.gz release/kax-windows-x86_64.zip release/checksums.txt)
          if ! gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$RELEASE_SHA" --title "$TAG" --generate-notes
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == true ]]; then
            test "$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')" = "$RELEASE_SHA"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false
          fi
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          uploaded="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "${asset##*/}" <<< "$uploaded"
          done

  # crates.io trusts this job (Trusted Publishing, environment crates-io):
  # no registry token is stored in the repository.
  crate:
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether this version is already on crates.io
        id: check
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY release workflow" "https://crates.io/api/v1/crates/kakaotalk-ax/${VERSION}")"
          if [ "$STATUS" = "200" ]; then
            echo "kakaotalk-ax ${VERSION} is already published on crates.io; skipping duplicate publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.published == 'false'
        id: auth
      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
